watch_stylesheet: true
watch_config: true
debug: false
update_check: true
bars:
  primary-bar:
    enabled: true
    screens: ["*"]
    class_name: "yasb-bar"
    alignment:
      position: "top"
    animation:
      enabled: true
      duration: 400
    blur_effect:
      enabled: true
      dark_mode: false
      round_corners: false
      round_corners_type: "normal"
      border_color: "system"
    window_flags:
      always_on_top: false
      windows_app_bar: true
    dimensions:
      width: "100%"
      height: 36
    padding:
      top: 0
      left: 0
      bottom: 0
      right: 0
    widgets:
      left:
      - "quick_launch"
      - "media"
      - "active_window"
      center:
      - "clock"
      right:
      - "volume"
      - "microphone"
      - "bluetooth"
      - "memory"
      - "cpu"
      - "temp_cpu"
      - "wifi"
      - "battery"
      - "power_menu"
      - "avatar_sync"
widgets:
  quick_launch:
    type: "yasb.quick_launch.QuickLaunchWidget"
    options:
      label: "<span>\ue721</span>"
      search_placeholder: "Buscar aplicativos..."
      max_results: 30
      show_icons: true
      icon_size: 16
      compact_text: true
      providers:
        apps:
          enabled: true
          prefix: "*"
          priority: 0
          show_recent: true
          max_recent: 5
          show_description: true
      popup:
        width: 720
        height: 480
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "system"
        dark_mode: true
      callbacks:
        on_left: "toggle_quick_launch"
      keybindings:
        - keys: "alt+space"
          action: "toggle_quick_launch"
          screen: "primary"
  clock:
    type: "yasb.clock.ClockWidget"
    options:
      label: "{%A, %d de %B de %Y  %H:%M}"
      locale: "pt_BR"
      timezones: []
      calendar: 
        blur: true
        round_corners: true
        alignment: "center"
        direction: "down"
        extended: true
        show_years: true
        show_holidays: true
        country_code: "BR"
        subdivision: "SP"
        show_week_numbers: false
      callbacks:
        on_left: "toggle_calendar"
        on_middle: "do_nothing"
        on_right: "context_menu"
  cpu:
    type: "yasb.cpu.CpuWidget"
    options:
      label: "<span>\ueea1</span> {info[percent][total]}%"
      label_alt: "<span>\ueea1</span> {info[freq][current]} MHz"
      update_interval: 2000
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
      callbacks:
        on_left: toggle_menu
        on_middle: do_nothing
        on_right: do_nothing
  memory:
    type: "yasb.memory.MemoryWidget"
    options:
      label: "<span>\ue964</span> {virtual_mem_percent}%"
      label_alt: "<span>\ue964</span> RAM: {virtual_mem_percent}% Swap: {swap_mem_percent}%"
      update_interval: 5000
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "do_nothing"
      menu:
        enabled: true
        show_graph: true
        show_graph_grid: true
        graph_history_size: 60
  power_menu:
    type: "yasb.power_menu.PowerMenuWidget"
    options:
      label: "<img src='C:/Users/majarao/.config/yasb/assets/avatar.png'>"
      uptime: true
      show_user: true
      menu_style: "popup"
      popup:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
      profile_image_size: 64
      buttons:
        lock: ["\ue72e", "Bloquear"]
        signout: ["\uf3b1", "Sair"]
        sleep: ["\uec46", "Suspender"]
        hibernate: ["\ue66d", "Hibernar"]
        restart: ["\ue72c", "Reiniciar"]
        shutdown: ["\ue7e8", "Desligar"]
        cancel: ["", "Cancelar"]
  media:
    type: "yasb.media.MediaWidget"
    options:
      label: "{title}"
      label_alt: "{artist} - {title}"
      hide_empty: true
      max_field_size:
        label: 30
        label_alt: 40
      show_thumbnail: true
      controls_only: false
      controls_left: true
      thumbnail_alpha: 80
      thumbnail_padding: 8
      thumbnail_corner_radius: 4
      icons:
        prev_track: "\uf8ac"
        next_track: "\uf8ad"
        play: "\uf5b0"
        pause: "\uf8ae"
      media_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "left"
        direction: "down"
        offset_top: 6
        offset_left: 0
        thumbnail_corner_radius: 8
        thumbnail_size: 100
        max_title_size: 60
        max_artist_size: 30
        show_source: false
        show_volume_slider: false
      media_menu_icons:
        play: "\uf5b0"
        pause: "\uf8ae"
        prev_track: "\uf8ac"
        next_track: "\uf8ad"
        mute: "\ue74f"
        unmute: "\ue767"
      callbacks:
        on_left: "toggle_media_menu"
        on_middle: "toggle_play_pause"
        on_right: "toggle_label"
  active_window:
    type: "yasb.active_window.ActiveWindowWidget"
    options:
      label: "{win[title]}"
      label_alt: "{win[process][name]}"
      label_no_window: ""
      label_icon: true
      label_icon_size: 16
      max_length: 50
      max_length_ellipsis: "..."
      monitor_exclusive: false
      ignore_window:
        classes: ["WorkerW", "Progman", "Shell_TrayWnd", "Shell_SecondaryTrayWnd"]
        processes: []
        titles: []
      callbacks:
        on_left: "do_nothing"
        on_middle: "do_nothing"
        on_right: "do_nothing"
  avatar_sync:
    # Invisivel: ao iniciar o YASB, atualiza assets/avatar.png com a foto da conta do Windows
    type: "yasb.custom.CustomWidget"
    options:
      label: "{data}"
      label_alt: "{data}"
      class_name: "avatar-sync"
      tooltip: false
      exec_options:
        run_cmd: "powershell.exe -NoProfile -ExecutionPolicy Bypass -File C:/Users/majarao/.config/yasb/scripts/update-avatar.ps1"
        run_once: true
        return_format: "string"
  bluetooth:
    type: "yasb.bluetooth.BluetoothWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span>"
      label_no_device: "Nenhum dispositivo conectado"
      tooltip: true
      icons:
        bluetooth_on: "\ue702"
        bluetooth_off: "\ue702"
        bluetooth_connected: "\ue702"
      menu_config:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        labels:
          title: "Bluetooth"
          your_devices: "Seus dispositivos"
          new_devices: "Novos dispositivos"
          not_connected: "Desconectado"
          connected: "Conectado"
          more_settings: "Mais configurações de Bluetooth"
          connect: "Conectar"
          disconnect: "Desconectar"
          connecting: "Conectando"
          disconnecting: "Desconectando"
          pair: "Parear"
          manage: "Gerenciar"
          power_on: "Ligado"
          power_off: "Desligado"
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "do_nothing"
  microphone:
    type: "yasb.microphone.MicrophoneWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span>{level}%"
      mute_text: "mudo"
      tooltip: true
      icons:
        normal: "\ue720"
        muted: "\uf781"
      mic_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
      callbacks:
        on_left: "toggle_mic_menu"
        on_middle: "do_nothing"
        on_right: "toggle_mute"
  temp_cpu:
    type: "yasb.libre_monitor.LibreHardwareMonitorWidget"
    options:
      label: "<span>\ue9ca</span> {info[value]}{info[unit]}"
      label_alt: "<span>\ue9ca</span> {info[value]}{info[unit]}"
      sensor_id: "/intelcpu/0/temperature/16"
      update_interval: 2000
      precision: 0
      server_host: "localhost"
      server_port: 8085
      sensor_id_error_label: "N/D"
      connection_error_label: "sem LHM"
      libre_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        header_label: "Temperaturas"
        precision: 0
        columns: 1
        sensors:
          - { id: "/intelcpu/0/temperature/16", name: "CPU (pacote)" }
          - { id: "/intelcpu/0/temperature/0", name: "CPU (núcleo mais quente)" }
          - { id: "/gpu-nvidia/0/temperature/0", name: "GPU" }
          - { id: "/gpu-nvidia/0/temperature/2", name: "GPU (hot spot)" }
          - { id: "/memory/dimm/0/temperature/0", name: "RAM" }
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "do_nothing"
  wifi:
    type: "yasb.wifi.WifiWidget"
    options:
      label: "<span>{wifi_icon}</span>"
      label_alt: "<span>{wifi_icon}</span>"
      ethernet_label: "<span>{wifi_icon}</span>"
      ethernet_label_alt: "<span>{wifi_icon}</span>"
      ethernet_icon: "\ue839"
      wifi_icons:
        - "\ue871"
        - "\ue872"
        - "\ue873"
        - "\ue874"
        - "\ue701"
      update_interval: 5000
      menu_config:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
      callbacks:
        on_left: "toggle_menu"
        on_middle: "do_nothing"
        on_right: "do_nothing"
  volume:
    type: "yasb.volume.VolumeWidget"
    options:
      label: "<span>{icon}</span>"
      label_alt: "<span>{icon}</span>"
      mute_text: "mudo"
      tooltip: true
      icons:
        - "\ue74f"
        - "\ue992"
        - "\ue993"
        - "\ue994"
        - "\ue995"
      audio_menu:
        blur: true
        round_corners: true
        round_corners_type: "normal"
        border_color: "System"
        alignment: "right"
        direction: "down"
        offset_top: 6
        offset_left: 0
        show_apps: true
        show_app_labels: true
        show_app_icons: true
        show_apps_expanded: false
      callbacks:
        on_left: "toggle_volume_menu"
        on_middle: "do_nothing"
        on_right: "toggle_mute"
  battery:
    type: "yasb.battery.BatteryWidget"
    options:
      label: "<span>{icon}</span> {percent}%"
      label_alt: "<span>{icon}</span> {percent}%"
      update_interval: 5000
      hide_unsupported: true
      time_remaining_natural: true
      charging_options:
        icon_format: "{charging_icon}"
        blink_charging_icon: false
      status_icons:
        icon_charging: "\ue83e"
        icon_critical: "\ue851"
        icon_low: "\ue853"
        icon_medium: "\ue855"
        icon_high: "\ue857"
        icon_full: "\ue83f"
      callbacks:
        on_left: "exec explorer.exe ms-settings:batterysaver"
        on_middle: "do_nothing"
        on_right: "do_nothing"
